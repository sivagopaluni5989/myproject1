name: trove
description: "💕 Never Miss a Statu"
publish_to: "none"

version: 1.0.1+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.2
  permission_handler: ^12.0.3
  path_provider: ^2.1.5
  google_mobile_ads: ^5.3.1
  video_thumbnail_plus: ^0.0.2
  video_player: ^2.9.2
  gallery_saver_plus: ^3.2.9
  shared_preferences: ^2.2.3
  shared_storage: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/new_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/new_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/new_logo.png
    - assets/icon/glass.png
